<!doctype html><html lang="ko"><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0}
html,body{width:1200px;height:630px}
body{background:#15171C;color:#F2F0E9;font-family:"Noto Sans CJK KR",sans-serif;position:relative;overflow:hidden}
.grid{position:absolute;inset:0;padding:64px 72px;display:grid;grid-template-columns:1fr 300px;gap:40px}
.brand{display:flex;align-items:center;gap:14px;font-size:30px;font-weight:700;letter-spacing:.01em}
.brand .x{color:#9EA2AA;font-weight:500}
.dot{width:14px;height:14px;border-radius:50%;background:#C8F03C}
h1{font-family:"Noto Serif CJK KR",serif;font-weight:900;font-size:76px;line-height:1.12;letter-spacing:-.02em;margin-top:44px}
h1 em{font-style:normal;color:#C8F03C}
p.sub{font-size:31px;line-height:1.45;color:#C9CBD0;margin-top:22px;font-weight:500}
.chips{position:absolute;left:72px;bottom:58px;display:flex;gap:12px}
.chip{font-size:24px;font-weight:700;padding:10px 20px;border-radius:999px;border:2px solid #3A3F48;color:#ECEAE3}
.chip.on{background:#C8F03C;border-color:#C8F03C;color:#15171C}
.glyph{font-family:"Noto Serif CJK KR",serif;font-weight:900;font-size:300px;line-height:1;color:#F2F0E9;text-align:right;margin-top:40px}
.foot{position:absolute;right:72px;top:236px;width:250px}
.bar{position:absolute;left:0;top:0;bottom:0;width:14px;background:#C8F03C}
.loc{position:absolute;right:72px;bottom:66px;font-size:22px;color:#9EA2AA;text-align:right;line-height:1.4}
</style></head><body>
<div class="bar"></div>
<div class="grid">
 <div>
  <div class="brand"><span class="dot"></span>BioGround <span class="x">× JGP</span></div>
  <h1><em>15분 무료</em><br>발 구조·균형 점검</h1>
  <p class="sub">내 발의 구조와 체중 분산,<br>숫자로 직접 확인해 보세요.</p>
 </div>
 <div class="glyph" aria-hidden="true">足</div>
</div>
<div class="chips"><span class="chip on">무료 예약</span><span class="chip">3분 자가 점검</span><span class="chip">예약금 0원</span></div>
<div class="loc">LA 코리아타운 · 부에나파크</div>
</body></html>
