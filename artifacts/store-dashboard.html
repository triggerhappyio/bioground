<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BioGround 매장 대시보드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@500;600;700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDEBE4; --surface:#F7F6F1; --raised:#FFFFFF; --fg:#15171C; --muted:#5B5E66; --line:#CBC7BC;
  --acid:#C8F03C; --refer:#A3402A; --refer-bg:#F2E2DB; --ok:#2F6B3A;
  --btn-bg:#15171C; --btn-fg:#F7F6F1;
  --serif:"Hahmlet","Noto Serif KR","AppleMyungjo",serif;
  --sans:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#121419; --surface:#1A1D23; --raised:#20242B; --fg:#ECEAE3; --muted:#A4A7AE; --line:#30343C;
    --refer:#E4896D; --refer-bg:#2B1E1A; --ok:#8FD19A; --btn-bg:#ECEAE3; --btn-fg:#121419; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121419; --surface:#1A1D23; --raised:#20242B; --fg:#ECEAE3; --muted:#A4A7AE; --line:#30343C;
  --refer:#E4896D; --refer-bg:#2B1E1A; --ok:#8FD19A; --btn-bg:#ECEAE3; --btn-fg:#121419; color-scheme:dark;
}
html{font-size:17px;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none !important}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--serif);font-weight:600;line-height:1.25;margin:0}
h2{font-size:1.45rem}
h3{font-size:1.1rem}
p{margin:.5em 0}
a{color:inherit}
:focus-visible{outline:3px solid var(--fg);outline-offset:2px;box-shadow:0 0 0 6px var(--acid)}
.muted{color:var(--muted)} .small{font-size:.86rem}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}

.top{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:12px 18px;padding-top:12px;padding-bottom:12px}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.brand .zu{font-family:var(--serif);font-weight:700;font-size:1.8rem;line-height:1}
.brand b{font-family:var(--serif);font-weight:600;font-size:1.1rem;display:block;line-height:1.1}
.brand span.sub{font-size:.78rem;color:var(--muted);display:block}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:transparent;color:var(--fg);font:inherit;font-size:.9rem;min-height:42px;padding:0 14px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.datenav{display:flex;align-items:center;gap:6px}
.datenav .d{font-family:var(--serif);font-weight:600;min-width:9.5em;text-align:center}
.iconbtn{border:1.5px solid var(--line);background:transparent;color:var(--fg);border-radius:10px;min-width:42px;min-height:42px;font:inherit;cursor:pointer}
.chip-sync{font-size:.8rem;padding:4px 10px;border-radius:999px;border:1.5px solid var(--line);color:var(--muted)}
.chip-sync.on{border-color:var(--fg);color:var(--fg)}
.tabs{display:flex;gap:4px;overflow-x:auto}
.tabs button{border:0;border-bottom:3px solid transparent;background:none;color:var(--muted);font:inherit;font-weight:600;padding:10px 14px;min-height:46px;cursor:pointer;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--fg)}
.tabs .badge{display:inline-block;min-width:1.5em;padding:0 6px;margin-left:6px;border-radius:999px;background:var(--refer);color:#fff;font-size:.75rem;line-height:1.5em;text-align:center}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;padding:0 18px;border-radius:999px;border:0;background:var(--btn-bg);color:var(--btn-fg);font:inherit;font-weight:600;cursor:pointer}
.btn.sec{background:transparent;color:var(--fg);border:1.5px solid var(--fg)}
.btn.ghost{background:transparent;color:var(--fg);border:1.5px solid var(--line)}
.btn.sm{min-height:38px;padding:0 13px;font-size:.88rem}
.btn.danger{background:transparent;color:var(--refer);border:1.5px solid var(--refer)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.row-actions{display:flex;flex-wrap:wrap;gap:8px}

.notice{border-left:4px solid var(--fg);background:var(--surface);padding:10px 14px;margin:14px 0;font-size:.92rem}
.notice.warn{border-color:var(--refer);background:var(--refer-bg)}
.statusline{font-family:var(--serif);font-size:1.25rem;margin:22px 0 4px;line-height:1.45}
.statusline b{font-weight:700}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:14px 0 6px}
.group-h{font-size:.92rem;font-weight:600;color:var(--muted);margin:26px 0 8px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.empty{color:var(--muted);padding:14px 0}

.visit{display:grid;grid-template-columns:4.6rem 1fr auto;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.visit .t{font-family:var(--serif);font-weight:700;font-size:1.2rem;font-variant-numeric:tabular-nums}
.visit .n{font-weight:600;font-size:1.05rem}
.visit .meta{font-size:.85rem;color:var(--muted)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.tag{font-size:.78rem;padding:1px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.tag.flag{border-color:var(--refer);color:var(--refer);font-weight:600}
.pill{display:inline-block;font-size:.78rem;font-weight:600;padding:2px 10px;border-radius:999px;border:1.5px solid var(--line);white-space:nowrap}
.pill.booked{border-color:var(--line);color:var(--muted)}
.pill.arrived{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.pill.checking{background:var(--acid);color:#15171C;border-color:var(--acid)}
.pill.done{border-color:var(--fg);color:var(--fg)}
.pill.noshow,.pill.cancelled{border-color:var(--refer);color:var(--refer)}
@media (max-width:640px){.visit{grid-template-columns:3.6rem 1fr}.visit .row-actions{grid-column:1 / -1}}

/* drawer */
.drawer{position:fixed;inset:0;z-index:40;display:flex;justify-content:flex-end;background:rgba(10,12,15,.42)}
.panel{width:min(640px,100%);height:100%;background:var(--bg);display:flex;flex-direction:column;border-left:1px solid var(--line)}
.panel-h{padding:calc(14px + env(safe-area-inset-top,0px)) 20px 10px;border-bottom:1px solid var(--line);background:var(--bg)}
.panel-h .who{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.panel-h .nm{font-family:var(--serif);font-size:1.35rem;font-weight:700}
.steps{display:flex;gap:4px;margin-top:12px;overflow-x:auto}
.steps button{flex:none;border:1.5px solid var(--line);background:transparent;color:var(--muted);border-radius:8px;font:inherit;font-size:.82rem;min-height:38px;padding:0 10px;cursor:pointer;white-space:nowrap}
.steps button[aria-current="step"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.steps button.visited{color:var(--fg);border-color:var(--fg)}
.panel-b{flex:1;overflow:auto;padding:16px 20px 24px}
.panel-f{display:flex;justify-content:space-between;gap:10px;padding:12px 20px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--bg)}
.script{font-family:var(--serif);font-size:1.08rem;line-height:1.5;padding:12px 16px;border-left:4px solid var(--acid);background:var(--surface);margin:0 0 16px}
.script small{display:block;font-family:var(--sans);font-size:.76rem;color:var(--muted);margin-bottom:2px}
.field{display:block;margin-top:14px}
.field > span{display:block;font-weight:600;margin-bottom:6px;font-size:.95rem}
input[type=text],input[type=tel],input[type=number],input[type=date],select,textarea{width:100%;min-height:46px;padding:8px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);color:var(--fg);font:inherit}
textarea{min-height:76px;resize:vertical}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{border:1.5px solid var(--line);background:var(--surface);color:var(--fg);border-radius:10px;min-height:46px;padding:0 14px;font:inherit;cursor:pointer}
.opt[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.qrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.qrow p{margin:0;flex:1}
.yn{display:flex;gap:6px;flex:none}
.yn button{min-width:62px;min-height:44px;border:1.5px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;font:inherit;cursor:pointer}
.yn button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.flagbox{border-left:5px solid var(--refer);background:var(--refer-bg);padding:12px 14px;border-radius:0 8px 8px 0;margin:14px 0}
.flagbox b{color:var(--refer)}
.flagbox ul{margin:6px 0 0;padding-left:1.1em}
.stance{display:grid;grid-template-columns:1.6rem 1fr;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.stance .k{font-family:var(--serif);font-weight:700;font-size:1.2rem}
.stance .ctl{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;align-items:center}
.stance .ctl input{width:84px;min-height:42px}
.stance.skip .nm{color:var(--muted);text-decoration:line-through}
.scorebox{display:flex;align-items:baseline;gap:14px;margin:16px 0 6px;flex-wrap:wrap}
.scorebox .s{font-family:var(--serif);font-weight:700;font-size:3.2rem;line-height:1;font-variant-numeric:tabular-nums}
.scorebox .b{font-family:var(--serif);font-size:1.3rem}
.tryrow{display:grid;grid-template-columns:1.2fr .8fr 1.4fr auto;gap:8px;align-items:center;margin-top:8px}
@media (max-width:560px){.tryrow{grid-template-columns:1fr 1fr}.tryrow input{grid-column:1 / -1}}
.check{display:flex;gap:10px;align-items:flex-start;margin-top:12px}
.check input{width:22px;height:22px;margin-top:3px;accent-color:var(--fg);flex:none}
.sumtable{width:100%;border-collapse:collapse;margin-top:8px;font-size:.92rem}
.sumtable th,.sumtable td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.sumtable th{color:var(--muted);font-weight:600;width:38%}

/* modal */
.modal{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;background:rgba(10,12,15,.5);padding:16px}
.dialog{width:min(560px,100%);max-height:92vh;overflow:auto;background:var(--bg);border-radius:10px;padding:20px;border:1px solid var(--line)}
.dialog .act{display:flex;justify-content:flex-end;gap:10px;margin-top:18px;flex-wrap:wrap}

/* result card */
.card{border:2px solid var(--fg);border-radius:8px;padding:20px;background:var(--raised)}
.card .ch{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.card .zu{font-family:var(--serif);font-weight:700;font-size:1.6rem}
.card .fid{font-family:var(--serif);font-weight:600;letter-spacing:.05em}
.card .big{font-family:var(--serif);font-weight:700;font-size:3rem;line-height:1;margin-top:12px}
.card dl{display:grid;grid-template-columns:7em 1fr;gap:6px 12px;margin:14px 0 0;font-size:.92rem}
.card dt{color:var(--muted)} .card dd{margin:0}
.card .disc{font-size:.78rem;color:var(--muted);margin-top:14px;border-top:1px solid var(--line);padding-top:8px}

/* follow-ups & kpi */
.fu{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.fu .due{font-size:.85rem}
.fu .due.over{color:var(--refer);font-weight:600}
.kpitable{width:100%;border-collapse:collapse;margin-top:10px}
.kpitable th,.kpitable td{padding:11px 8px;border-bottom:1px solid var(--line);text-align:left}
.kpitable th{font-size:.82rem;color:var(--muted);font-weight:600}
.kpitable td.v{font-family:var(--serif);font-weight:700;font-size:1.15rem;font-variant-numeric:tabular-nums}
.st-ok{color:var(--ok);font-weight:600} .st-no{color:var(--refer);font-weight:600}
.bars{display:grid;gap:10px;margin-top:10px}
.barrow{display:grid;grid-template-columns:8.5em 1fr 3.5em;gap:10px;align-items:center;font-size:.92rem}
.bar{height:12px;background:var(--line);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--fg)}
.storesel{min-height:42px;min-width:11em;max-width:60vw;border:1.5px solid var(--fg);border-radius:10px;background:var(--surface);color:var(--fg);font:inherit;font-weight:600;padding:0 10px}
.fpgrid{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}
.fpitem{width:118px;border:1.5px solid var(--line);border-radius:8px;background:var(--surface);padding:6px;font-size:.76rem;color:var(--muted);text-align:center}
.fpitem button.th{display:block;width:100%;height:124px;border:0;padding:0;background:var(--raised);cursor:zoom-in;border-radius:4px;overflow:hidden}
.fpitem img{width:100%;height:100%;object-fit:cover;display:block}
.fpitem .pdf{display:flex;align-items:center;justify-content:center;height:100%;font-weight:700;color:var(--fg)}
.fpitem .del{margin-top:4px;border:0;background:none;color:var(--refer);font:inherit;font-size:.76rem;cursor:pointer;min-height:30px}
.fpup{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.fpup label.btn{position:relative;overflow:hidden}
.fpup input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.storecard2{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.storecard2.off{opacity:.55}
.prev{width:100%;border-collapse:collapse;font-size:.84rem;margin-top:10px}
.prev th,.prev td{border-bottom:1px solid var(--line);padding:6px 4px;text-align:left;vertical-align:top}
.prev tr.bad td{color:var(--refer)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
@media (max-width:520px){.grid2{grid-template-columns:1fr}}
.foot{font-size:.8rem;color:var(--muted);border-top:1px solid var(--line);margin-top:40px;padding:14px 0 28px}

@media print{
  body *{visibility:hidden !important}
  #printCard, #printCard *{visibility:visible !important}
  #printCard{position:absolute;left:0;top:0;width:100%}
}
@media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}
.webbox{margin:12px 0;padding:12px 14px;border:1.5px solid var(--line);border-left:5px solid var(--fg);border-radius:10px}
.webbox .sumtable{margin-top:8px}
.tag.ret{background:var(--fg);color:var(--bg);border-color:var(--fg)}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand"><span class="zu" aria-hidden="true">足</span><span><b>BioGround 매장 대시보드</b><span class="sub">× JGP 아치빌트인</span></span></div>
    <select class="storesel" id="storeSel" aria-label="매장 선택"></select>
    <div class="datenav"><button class="iconbtn" data-act="dPrev" aria-label="이전 날">‹</button><span class="d" id="dLabel"></span><button class="iconbtn" data-act="dNext" aria-label="다음 날">›</button><button class="btn ghost sm" data-act="dToday">오늘</button></div>
    <span class="chip-sync" id="sync">연결 중</span>
  </div>
  <div class="wrap"><nav class="tabs" role="tablist" id="tabs"></nav></div>
</header>
<main class="wrap" id="app"></main>
<footer class="wrap foot">고객 기록은 매장 담당자 권한(Contributor 이상)이 있는 사람만 볼 수 있어요. 이 대시보드의 점검 기록은 웰니스 기록이며 의료 진단이 아닙니다. Balance Score는 임시 계산식이며 본사 5자세 프로토콜 확정본으로 교체됩니다.</footer>
<div class="drawer" id="drawer" hidden></div>
<div class="modal" id="modal" hidden></div>

/* ---------- helpers ---------- */
function pad(n){ return (n<10?"0":"")+n; }
function byId(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }
function iso(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function parseISO(s){ var p=String(s).split("-"); return new Date(+p[0], +p[1]-1, +p[2]); }
function todayISO(){ return iso(new Date()); }
function addDays(s,n){ var d=parseISO(s); d.setDate(d.getDate()+n); return iso(d); }
function addMonths(s,n){ var d=parseISO(s); d.setMonth(d.getMonth()+n); return iso(d); }
function kDate(s){ var d=parseISO(s); return (d.getMonth()+1)+"월 "+d.getDate()+"일 ("+["일","월","화","수","목","금","토"][d.getDay()]+")"; }
function kDateY(s){ var d=parseISO(s); return d.getFullYear()+"년 "+(d.getMonth()+1)+"월 "+d.getDate()+"일"; }
function digits(s){ return String(s||"").replace(/\D/g,""); }
function label(list,v){ for(var i=0;i<list.length;i++) if(list[i][0]===v) return list[i][1]; return ""; }
function isObj(v){ return v && typeof v==="object" && !Array.isArray(v); }
function merge(a,b){ var o=isObj(a)?Object.assign({},a):{}; Object.keys(b||{}).forEach(function(k){ o[k]=(isObj(b[k])&&isObj(o[k]))?merge(o[k],b[k]):b[k]; }); return o; }
function clone(o){ return JSON.parse(JSON.stringify(o||{})); }
function nowHM(){ var d=new Date(); var m=d.getHours()*60+d.getMinutes(); m=Math.ceil(m/20)*20; return pad(Math.floor(m/60)%24)+":"+pad(m%60); }
function makeFid(){ var c="ABCDEFGHJKMNPQRSTUVWXYZ23456789",s=""; for(var i=0;i<3;i++) s+=c.charAt(Math.floor(Math.random()*c.length)); return "LB-"+s+"-"+(1000+Math.floor(Math.random()*9000)); }
function newId(){ return "v"+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

/* ---------- scoring (임시 계산식) ---------- */
function calcScore(stances){
  if(!Array.isArray(stances)) return null;
  var any=false, total=0;
  stances.forEach(function(s){ if(typeof s==="number"){ any=true; total += Math.max(0,Math.min(10,s))/10*20; } });
  return any ? Math.round(total) : null;
}
function redFlagOf(sf){ sf=sf||{}; return !!(sf.fall2 || sf.wound || sf.rapid || (sf.diabetes && sf.numb)); }
function bandOf(score, flag){ if(flag) return "refer"; if(score==null) return null; return score>=80?"optimize":score>=60?"refine":score>=40?"restore":"refer"; }
function lockedStances(sf){ sf=sf||{}; return (sf.diabetes&&sf.numb) || sf.fall2 ? [2,3,4] : []; }

var LKEY="lebal_dash_v1";
var LPKEY="lebal_dash_people_v1";
var LSKEY="lebal_dash_stores_v1";
var backend = {
  db:null, col:null,
  init: function(){
    var self=this;
    renderAll();
    var has = window.claude && typeof window.claude.use==="function";
    if(!has){ self.startLocal(); return; }
    window.claude.use("db").then(function(db){
      if(!db){ self.startLocal(); return; }
      self.db=db; self.col=db.collection("visits"); S.mode="db";
      self.col.onSnapshot(function(snap){
        var map={}; snap.docs.forEach(function(d){ var v=d.data(); if(v) map[d.id]=Object.assign({id:d.id}, v); });
        S.visits=map; S.ready=true;
        if(S.openId && S.draft && map[S.openId]){ S.draft = merge(map[S.openId], S.draft); }
        renderAll();
      }, function(err){ S.mode="error"; S.ready=true; renderAll(); });
      db.collection("stores").onSnapshot(function(snap){ var m={}; snap.docs.forEach(function(d){ var v=d.data(); if(v) m[d.id]=Object.assign({id:d.id}, v); }); S.stores=m; renderAll(); }, function(){});
      window.claude.use("assets").then(function(a){ S.assets=a||null; renderAll(); if(S.openId) renderDrawer(); }).catch(function(){ S.assets=null; });
      db.collection("people").onSnapshot(function(snap){ var m={}; snap.docs.forEach(function(d){ var v=d.data(); if(v) m[d.id]=v; }); S.people=m; renderAll(); }, function(){});
      return window.claude.use("user");
    }).then(function(user){
      if(!user) return;
      Promise.all([user.can("data.write"), user.canEdit(), user.isOwner()]).then(function(r){
        S.canWrite = r[0]!==false; S.canAdmin = !!(r[1]||r[2]); renderAll();
      }).catch(function(){});
    }).catch(function(){ self.startLocal(); });
  },
  startLocal: function(){
    S.mode="local";
    try{ var raw=localStorage.getItem(LKEY); S.visits = raw ? JSON.parse(raw) : {}; }catch(e){ S.visits={}; }
    try{ var rp=localStorage.getItem(LPKEY); S.people = rp ? JSON.parse(rp) : {}; }catch(e){ S.people={}; }
    try{ var rs=localStorage.getItem(LSKEY); S.stores = rs ? JSON.parse(rs) : {}; }catch(e){ S.stores={}; }
    S.canAdmin = true;
    S.ready=true; renderAll();
  },
  saveLocal: function(){ try{ localStorage.setItem(LKEY, JSON.stringify(S.visits)); }catch(e){} },
  write: function(id, patch, isNew){
    var cur = S.visits[id] || {};
    S.visits[id] = merge(cur, patch); S.visits[id].id = id;
    if(S.mode!=="db"){ backend.saveLocal(); renderAll(); return Promise.resolve(); }
    var body = clone(patch); delete body.id;
    var prev = chains[id] || Promise.resolve();
    var ref = backend.col.doc(id);
    var full = clone(S.visits[id]); delete full.id;
    var p = prev.then(function(){ return isNew ? ref.set(full) : ref.update(body); })
      .catch(function(e){ if(e && e.code==="invalid_argument"){ S.canWrite=false; toast("저장 권한이 없어 보기 전용으로 바뀌었어요."); renderAll(); } else if(e && e.code==="quota_exceeded"){ toast("저장 공간이 가득 찼어요. 본사에 알려 주세요."); } else { toast("저장하지 못했어요. 잠시 뒤 다시 시도해 주세요."); } });
    chains[id]=p; renderAll(); return p;
  },
  writePerson: function(key, patch){
    var full = merge(S.people[key]||{}, patch); full.key = key; S.people[key] = full;
    if(S.mode!=="db"){ try{ localStorage.setItem(LPKEY, JSON.stringify(S.people)); }catch(e){} renderAll(); return Promise.resolve(); }

    chains[ck]=p; renderAll(); return p;
  },
  writeStore: function(id, data){
    var full = merge(S.stores[id]||{}, data); full.id = id; S.stores[id] = full;
    if(S.mode!=="db"){ try{ localStorage.setItem(LSKEY, JSON.stringify(S.stores)); }catch(e){} renderAll(); return Promise.resolve(); }
    var ck="S:"+id, prev=chains[ck]||Promise.resolve(), body=clone(full); delete body.id;
    var p=prev.then(function(){ return backend.db.collection("stores").doc(id).set(body); }).catch(function(e){ toast(e&&e.code==="invalid_argument" ? "매장 추가와 수정은 본사 관리자(Editor 이상)만 할 수 있어요." : "매장 정보를 저장하지 못했어요."); });
    chains[ck]=p; renderAll(); return p;
  },
  remove: function(id){
    delete S.visits[id];
    if(S.mode!=="db"){ backend.saveLocal(); renderAll(); return Promise.resolve(); }
    var prev = chains[id] || Promise.resolve();
    var p = prev.then(function(){ return backend.col.doc(id).delete(); }).catch(function(){ toast("삭제하지 못했어요."); });
    chains[id]=p; renderAll(); return p;
  }
};
function toast(msg){ var n=byId("toast"); if(!n){ n=document.createElement("div"); n.id="toast"; n.setAttribute("role","status"); n.style.cssText="position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;z-index:80;font-size:.9rem;max-width:90vw"; document.body.appendChild(n); } n.textContent=msg; n.hidden=false; clearTimeout(n._t); n._t=setTimeout(function(){ n.hidden=true; },3200); }

/* persist a patch for the open visit, honoring consent */
function persistDraft(patch){
  if(!S.openId) return;
  S.draft = merge(S.draft, patch);
  if(!S.canWrite){ renderDrawer(); return; }
  var out = clone(patch);
  if(S.draft.consent===false){ HEALTH_KEYS.forEach(function(k){ delete out[k]; }); }
  if(Object.keys(out).length) backend.write(S.openId, out); else renderDrawer();
}

/* ---------- queries ---------- */
function list(){ return Object.keys(S.visits).map(function(k){ return S.visits[k]; }); }
function storeVisits(){ return list().filter(function(v){ return (v.store||"ktown")===S.store; }); }
function dayVisits(){ return storeVisits().filter(function(v){ return v.date===S.date; }).sort(function(a,b){ return String(a.time).localeCompare(String(b.time)); }); }
function historyOf(v){
  var ph=digits(v.phone);
  return list().filter(function(o){ return o.id!==v.id && ((v.fid && o.fid===v.fid) || (ph.length>=7 && digits(o.phone)===ph)); })
    .sort(function(a,b){ return String(b.date).localeCompare(String(a.date)); });
}
function followups(){
  var t=todayISO(), out={d7:[],recheck:[],noshow:[]};
  storeVisits().forEach(function(v){
    if(v.outcome==="buy" && v.d7 && v.d7.due && !v.d7.done && v.d7.due<=addDays(t,2)) out.d7.push(v);
    if(v.recheck && v.recheck.due && !v.recheck.done && v.recheck.due<=addDays(t,14)) out.recheck.push(v);
    if(v.status==="noshow"){ var c=(v.noshowCall&&v.noshowCall.count)||0; if(c===0 || (c===1 && addDays(v.date,7)<=t)) out.noshow.push(v); }
  });
  ["d7","recheck"].forEach(function(k){ out[k].sort(function(a,b){ return String(a[k].due).localeCompare(String(b[k].due)); }); });
  return out;
}
function fuCount(){ var f=followups(); var t=todayISO(); return f.d7.filter(function(v){return v.d7.due<=t;}).length + f.recheck.filter(function(v){return v.recheck.due<=t;}).length + f.noshow.length; }

  Object.keys(S.stores).forEach(function(k){ m[k]=merge(m[k]||{}, S.stores[k]); m[k].id=k; });
  return Object.keys(m).map(function(k){ return m[k]; }).sort(function(a,b){ return ((a.order||99)-(b.order||99)) || String(a.createdAt||"").localeCompare(String(b.createdAt||"")); });
}
function activeStores(){ return allStores().filter(function(s){ return s.active!==false; }); }
function storeName(id){ var s=allStores().filter(function(x){ return x.id===id; })[0]; return s ? s.name : id; }

/* ---------- CRM: customer groups ---------- */
function daysBetween(a,b){ return Math.round((parseISO(b)-parseISO(a))/86400000); }
function computePeople(allStores){
  var t=todayISO(), all=list(), phoneToFid={}, map={}, out=[];
  all.forEach(function(v){ var d=digits(v.phone); if(v.fid && d.length>=7) phoneToFid[d]=v.fid; });
  function key(v){ var d=digits(v.phone); return v.fid || (d.length>=7 && phoneToFid[d]) || (d.length>=7 ? "p"+d : "v"+v.id); }
  all.forEach(function(v){ var k=key(v); (map[k]=map[k]||[]).push(v); });
  Object.keys(map).forEach(function(k){
    var vs=map[k].slice().sort(function(a,b){ return (String(b.date)+b.time).localeCompare(String(a.date)+a.time); });
    var latest=vs[0];
    if(!allStores && (latest.store||"ktown")!==S.store) return;
    var done=vs.filter(function(v){ return v.status==="done"; }), lastDone=done[0]||null;
    var buys=done.filter(function(v){ return v.outcome==="buy"; });
    var mv=vs.filter(function(v){ return v.marketingConsent!=null; })[0];
    var fam=[]; vs.forEach(function(v){ (v.familyIds||[]).forEach(function(id){ if(fam.indexOf(id)<0 && S.visits[id]) fam.push(id); }); });
    var pp=S.people[k]||{};
    var lastAct=[latest.date, pp.lastContactAt?pp.lastContactAt.slice(0,10):null].filter(Boolean).sort().pop();
    var g;
    if(lastDone && lastDone.consent===false) g="S-noconsent";
    else if(lastDone && !buys.length && (lastDone.outcome==="refer" || lastDone.redFlag)) g="S-refer";
    else if(buys.length){
      var lb=buys[0], dd=daysBetween(lb.date,t), rc=lb.recheck;
      if(dd<=30) g="B-adapt";
      else if(daysBetween(lastAct,t)>365) g="B-dormant";
      else if(dd>=365) g="B-replace";
      else if(rc && !rc.done && rc.due<=addDays(t,14)) g="B-recheck";
      else g="B-stable";
    } else if(done.length){
      var o=lastDone.outcome, r=lastDone.noBuyReason;
      g = o==="plan" ? "C-plan" : r==="size" ? "C-size" : r==="notneeded" ? "C-notneeded" : (r==="family"||r==="price") ? "C-think" : "C-unknown";
    } else g = (latest.status==="noshow"||latest.status==="cancelled") ? "A-noshow" : "A-booked";
    out.push({key:k, vs:vs, latest:latest, lastDone:lastDone, buys:buys, mkt:mv?mv.marketingConsent:null, fam:fam, group:g, pp:pp, lastAct:lastAct});
  });
  return out;
}
function nextAction(p){
  var r=p.lastDone && p.lastDone.noBuyReason;
  switch(p.group){
    case "A-booked": return {t:"예약 리마인더가 자동으로 나가요. 시니어는 전날 전화로도 확인하세요."};
    case "A-noshow": return {t:"재예약 연락은 최대 2회예요. 후속 연락 탭에서 진행하세요."};
    case "B-adapt": return {t:"7일차 착화 확인 전화, 30일 교환 기간 전 마지막 확인."};
    case "B-stable": return {t:"7일차 확인이 좋았다면 가족·지인 초대권 안내.", mkt:true};
    case "B-recheck": return {t:"재점검 초대: \"지난번 기록과 비교해 드릴게요.\""};
    case "B-replace": return {t:"밑창과 착화 상태 무료 점검 초대."};
    case "B-dormant": return {t:"1년에 한 번 새 시즌 소식만. 반응이 없으면 중단.", mkt:true};
    case "C-think": return r==="price" ? {t:"따로 연락하지 않아요. 재점검 때 할부 같은 선택지를 다시 안내."} : {t:"3~7일 뒤 가족에게 보여 줄 결과 요약 1회, 가족 동반 방문 안내."};
    case "C-plan": return {t:"4주 뒤 움직임 플랜 확인 연락 1회. 신발 권유는 하지 않음."};
    case "C-size": return {t:"사이즈가 들어오면 바로 알림. 중앙 창고 주문도 안내."};
    case "C-notneeded": return {t:"재점검 초대만 (4~5개월 뒤)."};
    case "C-unknown": return {t:"선택하지 않은 이유를 점검 기록의 '선택' 단계에 남겨 주세요."};
    case "S-refer": return {t:"2주 뒤 안부 연락 1회: \"전문의 상담은 받아 보셨어요?\" 신발 이야기는 하지 않음."};
    case "S-noconsent": return {t:"연락하지 않아요. 다시 오시면 처음부터 점검해 드려요."};
  }
  return {t:""};
}
function groupLabel(id){ var g=GROUPS.filter(function(x){ return x[0]===id; })[0]; return g ? (g[1]==="전체"?"전체":g[1]+": "+g[2]) : ""; }

function crmKpis(from, t){
  var vs=storeVisits().filter(function(v){ return v.date>=from && v.date<=t && v.source!=="walkin" && v.status!=="cancelled"; });
  var withCh=vs.filter(function(v){ return v.channel; }), ref=vs.filter(function(v){ return v.channel==="지인 추천"; });
  var ps=computePeople(false), base=0, ret=0;
  ps.forEach(function(p){
    var done=p.vs.filter(function(v){ return v.status==="done"; }).sort(function(a,b){ return String(a.date).localeCompare(String(b.date)); });
    var first=done[0]; if(!first || first.outcome==="buy") return;
    if(daysBetween(first.date,t)<90 || daysBetween(first.date,t)>270) return;
    base++;
    if(p.vs.some(function(v){ return v.date>first.date && daysBetween(first.date,v.date)<=90 && ["arrived","checking","done"].indexOf(v.status)>=0; })) ret++;
  });
  var contactable=ps.filter(function(p){ return p.group!=="S-noconsent" && p.lastDone; }), stopped=contactable.filter(function(p){ return p.pp.stop; });
  function pct(a,b){ return b ? Math.round(a/b*100) : null; }
  return {refRate: withCh.length ? pct(ref.length, withCh.length) : null, returnRate: pct(ret, base), stopRate: pct(stopped.length, contactable.length)};
}
function logContact(key, res){
  var pp=S.people[key]||{}, log=(pp.log||[]).slice(), now=new Date().toISOString();
  log.push({at:now, res:res}); if(log.length>30) log=log.slice(-30);
  backend.writePerson(key, {log:log, lastContactAt:now});
  toast(res==="answered" ? "연락 기록을 남겼어요." : "응답 없음으로 기록했어요.");
}

function shrinkImage(file){
  return new Promise(function(resolve){
    if(!/^image\/(jpeg|png|webp|heic|heif)/.test(file.type||"") || file.size < 2500000 || !window.createImageBitmap){ resolve(file); return; }
    createImageBitmap(file).then(function(bmp){
      var max=2200, sc=Math.min(1, max/Math.max(bmp.width,bmp.height)), c=document.createElement("canvas");
      c.width=Math.round(bmp.width*sc); c.height=Math.round(bmp.height*sc);
      c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);
      c.toBlob(function(b){ resolve(b||file); }, "image/jpeg", 0.86);
    }).catch(function(){ resolve(file); });
  });
}
function fpErr(e){
  var c=e&&e.code;
  if(c==="too_large") return "파일이 너무 커요 (20MB까지). 사진을 다시 찍어 주세요.";
  if(c==="unsupported_type") return "사진(JPG, PNG)이나 PDF만 올릴 수 있어요.";
  if(c==="quota_or_state") return "사진 저장 공간이 가득 찼어요. 본사에 알려 주세요.";
  if(c==="rate_limited") return "잠시 뒤 다시 올려 주세요.";
  if(c==="not_granted") return "사진을 올릴 권한이 없어요.";
  return "올리지 못했어요. 다시 시도해 주세요.";
}
function uploadFootprints(visitId, files){
  var v = (S.openId===visitId && S.draft) ? S.draft : S.visits[visitId];
  if(!v || !S.assets || !files || !files.length) return Promise.resolve();
  if(v.consent===false){ toast("동의하지 않은 고객이라 저장하지 않아요."); return Promise.resolve(); }
  FP_BUSY[visitId]=true; if(S.openId===visitId) renderDrawer();
  var added=[], list=Array.prototype.slice.call(files, 0, 8);
  return list.reduce(function(pr, f){ return pr.then(function(){
      return shrinkImage(f).then(function(b){
        var type = (b.type && b.type!=="") ? b.type : (/\.pdf$/i.test(f.name)?"application/pdf":"image/jpeg");
        return S.assets.upload(b, {type:type}).then(function(r){ added.push({id:r.id, type:r.contentType, at:new Date().toISOString()}); })
          .catch(function(e){ if(e&&e.code==="store_unavailable"){ return S.assets.upload(b,{type:type}).then(function(r){ added.push({id:r.id, type:r.contentType, at:new Date().toISOString()}); }); } throw e; });
      });
    }); }, Promise.resolve())
    .catch(function(e){ toast(fpErr(e)); })
    .then(function(){
      delete FP_BUSY[visitId];
      if(added.length){
        var cur = ((S.openId===visitId && S.draft) ? S.draft : S.visits[visitId]) || {};
        var next = (cur.footprints||[]).concat(added);
        if(S.openId===visitId) persistDraft({footprints:next}); else backend.write(visitId, {footprints:next});
        toast("족문지 "+added.length+"장을 올렸어요.");
      } else if(S.openId===visitId) renderDrawer();
    });
}
function deleteFootprintAt(visitId, k){
  var cur = ((S.openId===visitId && S.draft) ? S.draft : S.visits[visitId]) || {}, fps=(cur.footprints||[]).slice(), f=fps[k];
  if(!f) return;
  fps.splice(k,1);
  if(S.openId===visitId) persistDraft({footprints:fps}); else backend.write(visitId, {footprints:fps});
  if(S.assets) S.assets.delete(f.id).catch(function(){});
  toast("족문지를 삭제했어요.");
}

var bulkRows=[];
function parseDate(x){
  x=String(x||"").trim(); var m;
  if((m=x.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})$/))) return m[1]+"-"+pad(+m[2])+"-"+pad(+m[3]);
  if((m=x.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2,4})$/))){ var y=+m[3]; if(y<100) y+=2000; return y+"-"+pad(+m[1])+"-"+pad(+m[2]); }
  return null;
}
function parseBulk(text){
  var lines=String(text||"").split(/\r?\n/).filter(function(l){ return l.trim(); });
  var out=[];
  lines.forEach(function(l, i){
    var c = l.indexOf("\t")>=0 ? l.split("\t") : l.split(",");
    c=c.map(function(x){ return x.trim(); });
    if(i===0 && /이름|name/i.test(c[0])) return;
    var kindRaw=(c[3]||"").replace(/\s/g,""), buy=/^(구매|y|yes|o|buy|예)$/i.test(kindRaw), nobuy=/^(미구매|n|no|x|아니오|아니요)$/i.test(kindRaw);
    var r={name:c[0]||"", phone:c[1]||"", date:parseDate(c[2]), kind: buy?"buy":"nobuy", model:c[4]||"", size:c[5]||"", price:(c[6]||"").replace(/[^\d.]/g,""), memo:c[7]||"", errs:[]};
    if(!r.name) r.errs.push("이름 없음");
    if(digits(r.phone).length<7) r.errs.push("연락처");
    if(!r.date) r.errs.push("방문일 형식");
    else if(r.date>todayISO()) r.errs.push("미래 날짜");
    if(!buy && !nobuy) r.errs.push("구분은 구매 또는 미구매");
    if(buy && MODELS.every(function(m){ return m[0].toUpperCase()!==r.model.toUpperCase(); })) r.modelNote=true;
    out.push(r);
  });
  return out;
}

/* ---------- render ---------- */

  var active=document.activeElement, keepSearch = active && active.id==="searchIn" ? active.selectionStart : null;

/* ---------- events ---------- */
document.addEventListener("click", function(ev){
  var el=ev.target.closest("[data-act]"); if(!el || el.disabled) return;
  var a=el.dataset.act, id=el.dataset.id;
  if(a==="store"){ S.store=el.dataset.v; try{ localStorage.setItem("lebal_dash_store",S.store); }catch(e){} renderAll(); }
  else if(a==="dPrev"){ S.date=addDays(S.date,-1); renderAll(); }
  else if(a==="dNext"){ S.date=addDays(S.date,1); renderAll(); }
  else if(a==="dToday"){ S.date=todayISO(); renderAll(); }
  else if(a==="tab"){ S.tab=el.dataset.v; renderAll(); }
  else if(a==="period"){ S.kpiPeriod=el.dataset.v; renderAll(); }
  else if(a==="arrive"){ backend.write(id,{status:"arrived",arrivedAt:new Date().toISOString()}); }
  else if(a==="noshow"){ backend.write(id,{status:"noshow"}); }

  else if(a==="bf" && el.dataset.f==="ctype"){ var bf=bookingForm; ["Name","Phone","Memo","Date","Time","Last","Model"].forEach(function(k){ var e=byId("bf"+k); if(e){ var key={Name:"name",Phone:"phone",Memo:"memo",Date:"date",Time:"time",Last:"lastScan",Model:"model"}[k]; bf[key]=e.value; } }); bf.ctype=el.dataset.v; bookingModal(bf); }
  else if(a==="bf"){ var f=el.dataset.f, val=el.dataset.v; if(f==="focus"){ var i=bookingForm.focus.indexOf(val); if(i>=0) bookingForm.focus.splice(i,1); else bookingForm.focus.push(val); el.setAttribute("aria-pressed",String(i<0)); } else { bookingForm[f]=val; Array.prototype.forEach.call(el.parentElement.children,function(b){ b.setAttribute("aria-pressed",String(b===el)); }); } }
  else if(a==="bfSave"){ saveBooking(); }
  else if(a==="webImport"){ webImportModal(); }
  else if(a==="wiSave"){ webSave(); }
  else if(a==="mclose"){ closeModal(); }
  else if(a==="clearDemo"){ list().filter(function(v){return v.demo;}).forEach(function(v){ backend.remove(v.id); }); toast("예시 데이터를 지웠어요."); }
  else if(a==="fuDone"){
    var v2=S.visits[id], k=el.dataset.kind;
    if(k==="d7") backend.write(id,{d7:{done:true,doneAt:new Date().toISOString()}});
    else if(k==="recheck") backend.write(id,{recheck:{done:true,doneAt:new Date().toISOString()}});
    else if(k==="noshow") backend.write(id,{noshowCall:{count:((v2.noshowCall&&v2.noshowCall.count)||0)+1}});
  }
  else if(a==="storeNew"){ storeModal(null); }
  else if(a==="storeEdit"){ storeModal(el.dataset.v); }
  else if(a==="storeGo"){ S.store=el.dataset.v; try{ localStorage.setItem("lebal_dash_store",S.store); }catch(e){} S.tab="today"; renderAll(); }
  else if(a==="sf"){ storeForm[el.dataset.f]=el.dataset.v; Array.prototype.forEach.call(el.parentElement.children,function(b){ b.setAttribute("aria-pressed",String(b===el)); }); }
  else if(a==="sfSave"){ saveStoreForm(); }
  else if(a==="importOne"){ importModal(el.dataset.v); }
  else if(a==="impKind"){ readImportFields(); impForm.kind=el.dataset.v; renderImportModal(); }
  else if(a==="impSet"){ readImportFields(); impForm[el.dataset.f]=el.dataset.v; if(el.dataset.f==="outcome"||el.dataset.f==="reason"){ renderImportModal(); } else Array.prototype.forEach.call(el.parentElement.children,function(b){ b.setAttribute("aria-pressed",String(b===el)); }); }
  else if(a==="impSave"){ saveImport(!!el.dataset.more); }
  else if(a==="importBulk"){ bulkModal(); }
  else if(a==="bkCheck"){ bulkPreview(); }
  else if(a==="bkSave"){ bulkSave(); }
  else if(a==="fpView"){ var aid=el.dataset.aid, u="/_blob/"+aid; openModal((el.dataset.pdf==="1"?'<p><a class="btn" href="'+u+'" target="_blank" rel="noopener">PDF 열기</a></p>':'<img src="'+u+'" alt="족문지" style="width:100%;height:auto;border-radius:6px;display:block">')+'<div class="act"><a class="btn ghost" href="'+u+'" target="_blank" rel="noopener">새 창에서 보기</a><button class="btn" data-act="mclose">닫기</button></div>'); }
  else if(a==="fpDel"){ var vid=el.dataset.vid, kk=+el.dataset.k; openModal('<h2>족문지를 삭제할까요?</h2><p>삭제하면 되돌릴 수 없어요.</p><div class="act"><button class="btn ghost" data-act="mclose">취소</button><button class="btn danger" data-act="fpDelOk" data-vid="'+esc(vid)+'" data-k="'+kk+'">삭제</button></div>'); }
  else if(a==="fpDelOk"){ deleteFootprintAt(el.dataset.vid, +el.dataset.k); closeModal(); }
  else if(a==="crmGroup"){ S.crmGroup=el.dataset.v; renderAll(); }
  else if(a==="logContact"){ logContact(el.dataset.key, el.dataset.res); }
  else if(a==="stopContact"){ backend.writePerson(el.dataset.key, {stop:true, stopAt:new Date().toISOString()}); toast("연락 중단을 기록했어요."); }
  else if(a==="resumeContact"){ backend.writePerson(el.dataset.key, {stop:false}); }
  else if(a==="famToggle" || a==="famPhone"){
    var oid=el.dataset.oid;
    if(a==="famPhone"){ var fp=digits((byId("famPhone")||{}).value); if(fp.length<7){ toast("연락처를 7자리 이상 적어 주세요."); return; }
      var hit=list().filter(function(o){ return o.id!==S.openId && digits(o.phone)===fp; }).sort(function(x,y){ return String(y.date).localeCompare(String(x.date)); })[0];
      if(!hit){ toast("그 연락처로 방문한 고객이 없어요."); return; } oid=hit.id; if((S.draft.familyIds||[]).indexOf(oid)>=0){ toast("이미 연결돼 있어요."); return; } }
    var mineF=(S.draft.familyIds||[]).slice(), ix=mineF.indexOf(oid), other=S.visits[oid], theirs=((other&&other.familyIds)||[]).slice(), jx=theirs.indexOf(S.openId);

      else if(S.draft.consent!==true){ var keep={}; HEALTH_KEYS.forEach(function(k){ if(S.draft[k]!=null) keep[k]=S.draft[k]; }); S.draft.consent=true; persistDraft(keep); } persistDraft(patch); return; }
    if(field==="recheckMonths"){ persistDraft({recheckMonths:+val2}); return; }
    if(field==="marketingConsent"){ persistDraft({marketingConsent: val2==="yes"}); return; }
    if(multi){ var cur=(getPath(S.draft,field)||[]).slice(), j=cur.indexOf(val2); if(j>=0) cur.splice(j,1); else cur.push(val2); patch=setPath(S.draft, field, cur); }
    else patch=setPath(S.draft, field, val2);
    if(field==="outcome" && val2==="buy" && !(S.draft.purchase&&S.draft.purchase.model)){ var lt=(S.draft.tried||[]).slice(-1)[0]||{}; var m=MODELS.filter(function(x){return x[0]===lt.model;})[0]; patch.purchase={model:lt.model||"M808", size:lt.size||"8", price:m&&m[1]!=null?m[1]:null}; }
    persistDraft(patch);
  }
  else if(a==="safety"){ var sp={safety:{}}; sp.safety[el.dataset.k]=el.dataset.v==="1"; S.draft=merge(S.draft,sp); var r=recomputeScore(); sp.redFlag=r.redFlag; sp.score=r.score; sp.band=r.band; persistDraft(sp); }
  else if(a==="stance"){ var st=(Array.isArray(S.draft.stances)?S.draft.stances:[null,null,null,null,null]).slice(); var kv=+el.dataset.k; st[kv]= el.dataset.v==="skip" ? "skip" : +el.dataset.v; S.draft.stances=st; var r2=recomputeScore(); persistDraft({stances:st, score:r2.score, band:r2.band, redFlag:r2.redFlag}); }
  else if(a==="adoptFid"){ persistDraft({fid:el.dataset.fid}); }
  else if(a==="tryAdd"){ var tr=(S.draft.tried||[]).slice(); tr.push({model:"M808",size:"8",feel:""}); persistDraft({tried:tr}); }
  else if(a==="tryDel"){ var tr2=(S.draft.tried||[]).slice(); tr2.splice(+el.dataset.k,1); persistDraft({tried:tr2}); }

    if(d.consent!==false) fp.recheck={due:addMonths(d.date, +(d.recheckMonths||5)), done:(d.recheck&&d.recheck.done)||false};

document.addEventListener("input", function(ev){
  var t=ev.target;
  if(t.id==="searchIn"){ S.search=t.value; renderAll(); return; }
  if(t.id==="imPhone"){ updateDup(); return; }
  if(t.id==="wiText"){ webPreview(); return; }
  if(!S.openId) return;
  if(t.dataset.dfield){ var f=t.dataset.dfield, val=t.value; S.draft=merge(S.draft, setPath(S.draft,f,val)); clearTimeout(noteTimer); noteTimer=setTimeout(function(){ persistDraft(setPath(S.draft,f,val)); }, 700); return; }
  if(t.dataset.stance!=null){ var k=+t.dataset.stance, n=parseFloat(t.value); var st=(Array.isArray(S.draft.stances)?S.draft.stances:[null,null,null,null,null]).slice(); st[k]=isFinite(n)?Math.max(0,Math.min(10,n)):null; S.draft.stances=st; clearTimeout(noteTimer); noteTimer=setTimeout(function(){ var r=recomputeScore(); persistDraft({stances:st, score:r.score, band:r.band, redFlag:r.redFlag}); }, 600); return; }
});
document.addEventListener("change", function(ev){
  var t=ev.target;

  else if(t.dataset.pf){ var pu=Object.assign({}, S.draft.purchase||{}); var f=t.dataset.pf; pu[f]= f==="price" ? (t.value===""?null:+t.value) : t.value; if(f==="model"){ var m=MODELS.filter(function(x){return x[0]===t.value;})[0]; if(m&&m[1]!=null) pu.price=m[1]; } persistDraft({purchase:pu}); }
